[server]
; Use 0.0.0.0 for remote access, or 127.0.0.1 for local-only access.
bindAddress=0.0.0.0
httpPort=8765
httpsPort=8766
enableHttp=1
enableHttps=0
allowUnauthenticatedRemote=0
allowQueryToken=0
logRequests=1
corsOrigin=
maxBodyBytes=16777216
requestTimeoutSeconds=120
ideTimeoutSeconds=300
maxConnections=64
keepAliveSeconds=30

[auth]
; A 64-character token is generated automatically when this file is first created.
; Clients send: Authorization: Bearer <token>
token=

[tls]
; PFX/PKCS#12 file containing the server certificate and private key.
certificateFile=
certificatePassword=
; Alternatively select a certificate already installed in a Windows store.
certificateStore=MY
certificateThumbprint=

[ide]
; Optional. If blank, the add-in checks PATH and the VB6 setup registry key.
vb6Exe=
sourceEncoding=auto

[filesystem]
; Semicolon-separated roots available to source_read/source_write/source_edit/source_list.
; Open project directories are always included automatically.
allowedRoots=

[diagnostics]
debugLog=0
