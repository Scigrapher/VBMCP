name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build DLL and self-test
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Clean -Tests

      - name: Run integration tests
        shell: pwsh
        run: python .\tests\run_tests.py

      - name: Regenerate MCP tool reference
        shell: pwsh
        run: python .\tests\generate_tool_reference.py

      - name: Verify generated documentation is current
        shell: pwsh
        run: git diff --exit-code -- docs/MCP_TOOLS.md

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "ci-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Package deployment archive
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\package.ps1 -Version "${{ steps.version.outputs.value }}" -OutputDirectory .\dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCPAddin-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download deployment archive
        uses: actions/download-artifact@v4
        with:
          name: MCPAddin-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
